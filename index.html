<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<title>WishPic – Working MVP</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #0f0f0f;
    font-family: system-ui, sans-serif;
    color: #eaeaea;
    overflow: hidden;
  }

  /* EN YTA */
  #canvas {
  position: relative;
  width: 100%;
  height: 100%;
  background-image: url("CN_GRApp.jpg");
  background-size: cover;        /* följer resize */
  background-position: center;   /* håller fokus */
  background-repeat: no-repeat;
}
  /* FRÅGEPANEL (flytande) */
  #questionBox {
    position: absolute;
    left: 20px;
    top: 20px;
    width: 320px;
    background: rgba(20,20,20,0.9);
    border: 1px solid #222;
    border-radius: 10px;
    padding: 16px;
    z-index: 10;
  }

  #progress {
    font-size: 12px;
    color: #777;
    margin-bottom: 6px;
  }

  .option {
    display: inline-block;
    margin: 6px 6px 0 0;
    padding: 6px 12px;
    background: #222;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
  }
  .option:hover { background: #444; }

  /* SYMBOLER */
  .symbol {
    position: absolute;
    font-size: 26px;
    transition: transform .2s ease;
  }

  /* ANKARE (synliga nu, kan döljas senare) */
  .anchor {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    opacity: .5;
  }
  #situationAnchor { left: 8%; bottom: 18%; background:#ff6666; }
  #visionAnchor { right: 12%; top: 18%; background:#66ff99; }

  .label {
    position: absolute;
    font-size: 11px;
    color: #777;
    transform: translate(-50%, -150%);
  }
</style>
</head>

<body>

<div id="canvas">

  <!-- Frågor -->
  <div id="questionBox">
    <div id="progress"></div>
    <strong id="question"></strong>
    <div id="options"></div>
  </div>

  <!-- Ankare -->
  <div id="situationAnchor" class="anchor">
    <div class="label">Situation</div>
  </div>
  <div id="visionAnchor" class="anchor">
    <div class="label">Vision</div>
  </div>

</div>

<script>
/* ---------------- DATA ---------------- */

const SYMBOLS = {
  "IT & programvara":"💻","Tillverkning":"🏭","Företagstjänster":"🏢",
  "Transport & logistik":"🚚","Energi":"⚡","Jordbruk":"🌾","Hälsa":"🩺","Bygg / Government":"🏗️",

  "Startup":"🚀","Etablerad":"🏛️","Transformerande":"🔁","Återuppfinnande":"🧠",

  "Träd":"🌳","Skepp":"🚢","Ballong":"🎈","Ubåt":"🚤","Vindkraftverk":"🌬️",

  "Strategi":"🗺️","Marknadsplan":"📣","Roadmap":"🧭",

  "Organiskt":"🌱","Kort sikt":"⏱️","Lång sikt":"📆",

  "Kanoner":"💣","Eld":"🔥","Regn":"🌧️","Virus":"🦠",

  "Växa snabbt":"📈","Lösa problem":"🧩","Göra saker bättre":"✨","Uppgradera":"⬆️",

  "Triangel":"🔺","Kvadrat":"⬛","Cirkel":"⚪","Stjärna":"⭐"
};

const steps = [
  { q:"Vilket område är du inom?", zone:"situation",
    options:["IT & programvara","Tillverkning","Företagstjänster","Transport & logistik","Energi","Jordbruk","Hälsa","Bygg / Government"] },

  { q:"Är du som företag idag?", zone:"situation",
    options:["Startup","Etablerad","Transformerande","Återuppfinnande"] },

  { q:"Ikon som liknar er situation mest", zone:"situation",
    options:["Träd","Skepp","Ballong","Ubåt","Vindkraftverk"] },

  { q:"Vad behöver ni mest just nu?", zone:"path",
    options:["Strategi","Marknadsplan","Roadmap"] },

  { q:"Hur vill ni utvecklas?", zone:"path",
    options:["Organiskt","Kort sikt","Lång sikt"] },

  { q:"Ikon för största utmaningen", zone:"path",
    options:["Kanoner","Eld","Regn","Virus"] },

  { q:"Vilken vision driver er?", zone:"vision",
    options:["Växa snabbt","Lösa problem","Göra saker bättre","Uppgradera"] },

  { q:"Välj ikon för ert mål", zone:"vision",
    options:["Triangel","Kvadrat","Cirkel","Stjärna"] }
];

/* ---------------- STATE ---------------- */

let step = 0;
const placedSymbols = [];

/* ---------------- ELEMENTS ---------------- */

const canvas = document.getElementById("canvas");
const qEl = document.getElementById("question");
const oEl = document.getElementById("options");
const pEl = document.getElementById("progress");

const sAnchor = document.getElementById("situationAnchor");
const vAnchor = document.getElementById("visionAnchor");

/* ---------------- HELPERS ---------------- */

function rand(min,max){ return min + Math.random()*(max-min); }

/* ---------------- LOGIC ---------------- */

function place(answer, zone) {
  placedSymbols.push({
    answer,
    zone,
    rx: rand(-0.25,0.25),
    ry: rand(-0.25,0.25)
  });
  renderSymbols();
}

function renderSymbols() {
  document.querySelectorAll(".symbol").forEach(e => e.remove());

  const c = canvas.getBoundingClientRect();
  const s = sAnchor.getBoundingClientRect();
  const v = vAnchor.getBoundingClientRect();

  placedSymbols.forEach(item=>{
    const el = document.createElement("div");
    el.className = "symbol";
    el.textContent = SYMBOLS[item.answer] || "⬜";

    let ax, ay;
    if(item.zone==="situation"){ ax=s.left; ay=s.top; }
    if(item.zone==="vision"){ ax=v.left; ay=v.top; }
    if(item.zone==="path"){
      ax=(s.left+v.left)/2;
      ay=(s.top+v.top)/2;
    }

    el.style.left = (ax - c.left + item.rx * 300) + "px";
    el.style.top  = (ay - c.top  + item.ry * 300) + "px";

    canvas.appendChild(el);
  });
}

window.addEventListener("resize", renderSymbols);

/* ---------------- UI FLOW ---------------- */

function renderQuestion() {
  pEl.textContent = `${step+1} / ${steps.length}`;
  qEl.textContent = steps[step].q;
  oEl.innerHTML = "";

  steps[step].options.forEach(opt=>{
    const b = document.createElement("div");
    b.className = "option";
    b.textContent = opt;
    b.onclick = ()=>{
      place(opt, steps[step].zone);
      step++;
      if(step < steps.length) renderQuestion();
      else qEl.textContent = "Klar.";
    };
    oEl.appendChild(b);
  });
}

renderQuestion();
</script>

</body>
</html>
