<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WishPic</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      height: 100vh;
      display: flex;
      background: #0f0f0f;
      color: #eaeaea;
    }
    .left, .right {
      padding: 24px;
      overflow: auto;
    }
    .left {
      width: 45%;
      border-right: 1px solid #222;
      background: #0f0f0f;
    }
    .right {
      width: 55%;
      background: #111;
    }
    h1 {
      margin-top: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .progress {
      color: #888;
      font-size: 12px;
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      resize: none;
      font-size: 14px;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
    }
    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .card {
      background: #151515;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .placeholder {
      color: #555;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="left">
  <div class="progress" id="progress"></div>
  <h1 id="question"></h1>
  <button id="next" disabled>Next</button>
</div>

<div class="right">
  <h1>Live Map</h1>
  <div id="preview" class="placeholder">
    Your visual structure appears here while you answer.
  </div>
</div>

<script>const SYMBOLS = {
  "Startup": "🚀",
  "Scaleup": "📈",
  "Innovation team": "🧪",
  "Business development": "🧭",

  "Grow faster": "⚡",
  "Find focus": "🎯",
  "Align the team": "🤝",
  "Explore new directions": "🌱",

  "Clear strategy": "🗺️",
  "Stronger execution": "🔧",
  "New business model": "💡",
  "Scalable growth": "🏗️",

  "Priorities": "⭐",
  "Ownership": "🖐️",
  "Speed": "⏩",
  "Quality": "✔️",

  "Too many initiatives": "🌀",
  "Unclear direction": "❓",
  "Lack of resources": "🪫",
  "Low alignment": "🔀",

  "Decision-making": "⚖️",
  "Communication": "💬",
  "Processes": "⚙️",
  "Capabilities": "🧠",

  "Ongoing initiatives": "🔄",
  "Experiments": "🧫",
  "Internal change": "🔁",
  "Nothing yet": "⏸️",

  "Market": "🌍",
  "Execution": "🏃",
  "Team": "👥",
  "Timing": "⏰",

  "Scale": "📊",
  "Invest": "💰",
  "Expand": "➕",
  "Refocus": "🔄"
};

  const steps = [
    {
      q: "What best describes your team or organization?",
      options: ["Startup", "Scaleup", "Innovation team", "Business development"]
    },
    {
      q: "What is your main ambition right now?",
      options: ["Grow faster", "Find focus", "Align the team", "Explore new directions"]
    },
    {
      q: "If things go well, what should be true in 12–24 months?",
      options: ["Clear strategy", "Stronger execution", "New business model", "Scalable growth"]
    },
    {
      q: "What matters most to get right?",
      options: ["Priorities", "Ownership", "Speed", "Quality"]
    },
    {
      q: "What is the biggest obstacle today?",
      options: ["Too many initiatives", "Unclear direction", "Lack of resources", "Low alignment"]
    },
    {
      q: "What other obstacles are slowing you down?",
      options: ["Decision-making", "Communication", "Processes", "Capabilities"]
    },
    {
      q: "What is already in motion?",
      options: ["Ongoing initiatives", "Experiments", "Internal change", "Nothing yet"]
    },
    {
      q: "What feels unclear or risky?",
      options: ["Market", "Execution", "Team", "Timing"]
    },
    {
      q: "What would success make possible next?",
      options: ["Scale", "Invest", "Expand", "Refocus"]
    }
  ];

  let step = 0;
  const answers = [];

  const qEl = document.getElementById("question");
  const pEl = document.getElementById("progress");
  const preview = document.getElementById("preview");
  const left = document.querySelector(".left");

  function render() {
    pEl.textContent = `${step + 1} / ${steps.length}`;
    qEl.textContent = steps[step].q;

    const buttons = steps[step].options
      .map(
        opt => `<button class="option-btn">${opt}</button>`
      )
      .join("");

    left.querySelectorAll(".option-btn").forEach(b => b.remove());
    qEl.insertAdjacentHTML("afterend", `<div class="options">${buttons}</div>`);

    document.querySelectorAll(".option-btn").forEach(btn => {
      btn.onclick = () => {
        answers[step] = btn.textContent;
        step++;
        if (step < steps.length) {
          render();
        } else {
          showResult();
        }
      };
    });

    renderPreview();
  }

  function renderPreview() {
    preview.innerHTML = answers
      .map((a, i) => `<div class="card"><strong>${i + 1}</strong> · ${a}</div>`)
      .join("") || `<div class="placeholder">Your visual structure appears here.</div>`;
  }

  function showResult() {
    qEl.textContent = "Done.";
    document.querySelector(".options").remove();
    pEl.textContent = "Result";
    renderPreview();
  }

  render();
</script>


</body>
</html>
