<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WishPic – Visual Strategy</title>
</head>
<body>
  <h1>WishPic</h1>

  <form id="wishpic-form">
    <label>
      Organization
      <input type="text" id="org" required>
    </label>
    <br><br>

    <label>
      Current situation
      <textarea id="now" rows="3" required></textarea>
    </label>
    <br><br>

    <label>
      Vision / Goal
      <textarea id="vision" rows="3" required></textarea>
    </label>
    <br><br>

    <label>
      Challenges / Obstacles
      <textarea id="blocks" rows="3"></textarea>
    </label>
    <br><br>

    <button type="submit">Create WishPic</button>
  </form>

  <pre id="output"></pre>

  <script src="script.js"></script>
</body>
</html>
