<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WishPic – Visual Strategy</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      font-family: Inter, system-ui, sans-serif;
      background: #0f0f0f;
      color: #eaeaea;
    }

    /* LEFT: FORM */
    .left {
      width: 42%;
      padding: 32px;
      border-right: 1px solid #222;
    }

    .progress {
      font-size: 12px;
      color: #777;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 16px 0;
    }

    .options button {
      display: block;
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      padding: 10px 14px;
      border-radius: 18px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    .options button:hover {
      background: #1a1a1a;
    }

    /* RIGHT: VISUAL MAP */
    .right {
      width: 58%;
      padding: 32px;
      position: relative;
    }

    .map {
      position: relative;
      height: 100%;
    }

    /* Invisible logical zones */
    .zone {
      position: absolute;
      top: 80px;
      height: calc(100% - 120px);
      padding: 10px;
    }

    #zone-situation { left: 0; width: 30%; }
    #zone-path      { left: 35%; width: 30%; }
    #zone-vision    { left: 70%; width: 30%; }

    /* SYMBOLS */
    .symbol {
      position: absolute;
      font-size: 28px;
      opacity: 0;
      animation: appear 0.3s ease forwards;
    }

    @keyframes appear {
      to { opacity: 1; }
    }

    .hint {
      position: absolute;
      bottom: 24px;
      left: 32px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <!-- LEFT -->
  <div class="left">
    <div class="progress" id="progress"></div>
    <h1 id="question"></h1>
    <div class="options" id="options"></div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="map">
      <div class="zone" id="zone-situation"></div>
      <div class="zone" id="zone-path"></div>
      <div class="zone" id="zone-vision"></div>
    </div>
    <div class="hint">Situation → Path → Vision</div>
  </div>

<script>
/* SYMBOL LANGUAGE (replace with your own icons later) */
const SYMBOLS = {
  Startup: "🚀",
  Scaleup: "📈",
  "Innovation team": "🧪",
  "Business development": "🧭",

  "Grow faster": "⚡",
  "Find focus": "🎯",
  "Align the team": "🤝",
  "Explore new directions": "🌱",

  "Clear strategy": "🗺️",
  "Stronger execution": "🔧",
  "New business model": "💡",
  "Scalable growth": "🏗️",

  Priorities: "⭐",
  Ownership: "🖐️",
  Speed: "⏩",
  Quality: "✔️"
};

/* METHOD: 1 (situation) → 3 (path) → 2 (vision) */
const steps = [
  { q: "What best describes your organization?", zone: "situation",
    options: ["Startup","Scaleup","Innovation team","Business development"] },

  { q: "What matters most to get right?", zone: "path",
    options: ["Priorities","Ownership","Speed","Quality"] },

  { q: "What is your main ambition?", zone: "vision",
    options: ["Grow faster","Find focus","Align the team","Explore new directions"] },

  { q: "If things go well, what should be true in 12–24 months?", zone: "vision",
    options: ["Clear strategy","Stronger execution","New business model","Scalable growth"] }
];

let step = 0;
const zoneCounters = { situation:0, path:0, vision:0 };

const qEl = document.getElementById("question");
const pEl = document.getElementById("progress");
const optionsEl = document.getElementById("options");

function render() {
  const s = steps[step];
  pEl.textContent = `${step + 1} / ${steps.length}`;
  qEl.textContent = s.q;

  optionsEl.innerHTML = "";
  s.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.textContent = opt;
    btn.onclick = () => select(opt, s.zone);
    optionsEl.appendChild(btn);
  });
}

function select(answer, zone) {
  placeSymbol(answer, zone);
  step++;
  if (step < steps.length) render();
  else finish();
}

function placeSymbol(answer, zone) {
  const zoneEl = document.getElementById(`zone-${zone}`);
  const el = document.createElement("div");
  el.className = "symbol";
  el.textContent = SYMBOLS[answer] || "⬜";

  const index = zoneCounters[zone]++;
  const col = index % 3;
  const row = Math.floor(index / 3);

  el.style.left = `${20 + col * 48}px`;
  el.style.top  = `${40 + row * 48}px`;

  zoneEl.appendChild(el);
}

function finish() {
  qEl.textContent = "Your WishPic is ready.";
  optionsEl.innerHTML = "";
  pEl.textContent = "Done";
}

render();
</script>

</body>
</html>
