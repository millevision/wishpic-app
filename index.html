<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WishPic – MVP</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0f0f0f;
    color: #eaeaea;
    display: flex;
    height: 100vh;
  }

  .left {
    width: 40%;
    padding: 24px;
    border-right: 1px solid #222;
  }

  .right {
    width: 60%;
    padding: 24px;
  }

  h1 { font-size: 18px; margin-top: 0; }

  .option {
    display: inline-block;
    margin: 6px 6px 0 0;
    padding: 6px 12px;
    background: #222;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
  }

  .option:hover { background: #444; }

  .map {
    display: flex;
    height: 100%;
    gap: 24px;
  }

  .zone {
    flex: 1;
    border: 1px dashed #333;
    border-radius: 8px;
    padding: 12px;
    position: relative;
  }

  .symbol {
    font-size: 28px;
    margin: 6px;
    display: inline-block;
  }

  .label {
    font-size: 12px;
    color: #777;
    margin-bottom: 6px;
  }
</style>
</head>

<body>

<div class="left">
  <div id="progress"></div>
  <h1 id="question"></h1>
  <div id="options"></div>
</div>

<div class="right">
  <h1>WishPic – Live Map</h1>
  <div class="map">
    <div class="zone" id="zone-situation">
      <div class="label">Situation</div>
    </div>
    <div class="zone" id="zone-path">
      <div class="label">Path</div>
    </div>
    <div class="zone" id="zone-vision">
      <div class="label">Vision</div>
    </div>
  </div>
</div>

<script>
const SYMBOLS = {
  "IT & programvara":"💻","Tillverkning":"🏭","Företagstjänster":"🏢",
  "Transport & logistik":"🚚","Energi":"⚡","Jordbruk":"🌾","Hälsa":"🩺","Bygg / Government":"🏗️",

  "Startup":"🚀","Etablerad":"🏛️","Transformerande":"🔁","Återuppfinnande":"🧠",

  "Träd":"🌳","Skepp":"🚢","Ballong":"🎈","Ubåt":"🚤","Vindkraftverk":"🌬️",

  "Strategi":"🗺️","Marknadsplan":"📣","Roadmap":"🧭",

  "Organiskt":"🌱","Kort sikt":"⏱️","Lång sikt":"📆",

  "Kanoner":"💣","Eld":"🔥","Regn":"🌧️","Virus":"🦠",

  "Växa snabbt":"📈","Lösa problem":"🧩","Göra saker bättre":"✨","Uppgradera":"⬆️",

  "Triangel":"🔺","Kvadrat":"⬛","Cirkel":"⚪","Stjärna":"⭐"
};

const steps = [
  { q:"Vilket område är du inom?", zone:"situation",
    options:["IT & programvara","Tillverkning","Företagstjänster","Transport & logistik","Energi","Jordbruk","Hälsa","Bygg / Government"] },

  { q:"Är du som företag idag?", zone:"situation",
    options:["Startup","Etablerad","Transformerande","Återuppfinnande"] },

  { q:"Ikon som liknar er situation mest", zone:"situation",
    options:["Träd","Skepp","Ballong","Ubåt","Vindkraftverk"] },

  { q:"Vad behöver ni mest just nu?", zone:"path",
    options:["Strategi","Marknadsplan","Roadmap"] },

  { q:"Hur vill ni utvecklas?", zone:"path",
    options:["Organiskt","Kort sikt","Lång sikt"] },

  { q:"Ikon för största utmaningen", zone:"path",
    options:["Kanoner","Eld","Regn","Virus"] },

  { q:"Vilken vision driver er?", zone:"vision",
    options:["Växa snabbt","Lösa problem","Göra saker bättre","Uppgradera"] },

  { q:"Välj ikon för ert mål", zone:"vision",
    options:["Triangel","Kvadrat","Cirkel","Stjärna"] }
];

let step = 0;

const qEl = document.getElementById("question");
const oEl = document.getElementById("options");
const pEl = document.getElementById("progress");

function render() {
  pEl.textContent = `${step+1} / ${steps.length}`;
  qEl.textContent = steps[step].q;
  oEl.innerHTML = "";

  steps[step].options.forEach(opt=>{
    const b = document.createElement("div");
    b.className = "option";
    b.textContent = opt;
    b.onclick = ()=>select(opt);
    oEl.appendChild(b);
  });
}

function select(answer) {
  const zone = steps[step].zone;
  const symbol = SYMBOLS[answer] || "⬜";

  const el = document.createElement("div");
  el.className = "symbol";
  el.textContent = symbol;
  document.getElementById("zone-"+zone).appendChild(el);

  step++;
  if(step < steps.length) render();
  else qEl.textContent = "Klar.";
}

render();
</script>

</body>
</html>
