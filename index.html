<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WishPic</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      height: 100vh;
      display: flex;
      background: #0f0f0f;
      color: #eaeaea;
    }
    .left, .right {
      padding: 24px;
      overflow: auto;
    }
    .left {
      width: 45%;
      border-right: 1px solid #222;
      background: #0f0f0f;
    }
    .right {
      width: 55%;
      background: #111;
    }
    h1 {
      margin-top: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .progress {
      color: #888;
      font-size: 12px;
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      resize: none;
      font-size: 14px;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
    }
    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .card {
      background: #151515;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .placeholder {
      color: #555;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="left">
  <div class="progress" id="progress"></div>
