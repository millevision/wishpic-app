<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<title>WishPic – One Space Test</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #0f0f0f;
    font-family: system-ui, sans-serif;
    color: #eaeaea;
    overflow: hidden;
  }

  /* EN YTA */
  .canvas {
    position: relative;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at bottom left, #1a1a1a, #0f0f0f 60%);
  }

  /* FRÅGOR (flytande, inte kolumn) */
  .question-box {
    position: absolute;
    left: 24px;
    top: 24px;
    max-width: 320px;
    background: rgba(20,20,20,0.9);
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #222;
  }

  .option {
    display: inline-block;
    margin: 6px 6px 0 0;
    padding: 6px 12px;
    background: #222;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
  }
  .option:hover { background:#444; }

  /* SYMBOLER */
  .symbol {
    position: absolute;
    font-size: 26px;
    transition: all .4s ease;
  }

  /* ANKARE (synliga nu, döljs sen) */
  .anchor {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    opacity: .5;
  }
  #situation { left: 8%; bottom: 18%; background:#ff6666; }
  #vision { right: 12%; top: 18%; background:#66ff99; }

  .label {
    position: absolute;
    font-size: 12px;
    color: #777;
    transform: translate(-50%, -150%);
  }
</style>
</head>

<body>

<div class="canvas" id="canvas">

  <!-- Frågor -->
  <div class="question-box">
    <div id="progress"></div>
    <strong id="question"></strong>
    <div id="options"></div>
  </div>

  <!-- Ankare -->
  <div id="situation" class="anchor">
    <div class="label">Situation</div>
  </div>
  <div id="vision" class="anchor">
    <div class="label">Vision</div>
  </div>

</div>

<script>
/* DATA */
const SYMBOLS = {
  "Startup":"🚀","Etablerad":"🏛️","Transformerande":"🔁","Återuppfinnande":"🧠",
  "Strategi":"🗺️","Marknadsplan":"📣","Roadmap":"🧭",
  "Växa snabbt":"📈","Lösa problem":"🧩","Göra saker bättre":"✨","Uppgradera":"⬆️"
};

const steps = [
  { q:"Är du som företag idag?", zone:"situation",
    options:["Startup","Etablerad","Transformerande","Återuppfinnande"] },

  { q:"Vad behöver ni mest just nu?", zone:"path",
    options:["Strategi","Marknadsplan","Roadmap"] },

  { q:"Vilken vision driver er?", zone:"vision",
    options:["Växa snabbt","Lösa problem","Göra saker bättre","Uppgradera"] }
];

let step = 0;

/* ELEMENT */
const qEl = document.getElementById("question");
const oEl = document.getElementById("options");
const pEl = document.getElementById("progress");
const canvas = document.getElementById("canvas");

const sAnchor = document.getElementById("situation");
const vAnchor = document.getElementById("vision");

function rand(min,max){ return min + Math.random()*(max-min); }

function place(answer, zone) {
  const el = document.createElement("div");
  el.className = "symbol";
  el.textContent = SYMBOLS[answer] || "⬜";

  const s = sAnchor.getBoundingClientRect();
  const v = vAnchor.getBoundingClientRect();
  const c = canvas.getBoundingClientRect();

  let x,y;

  if(zone==="situation"){
    x = s.left - c.left + rand(-40,40);
    y = s.top - c.top + rand(-40,40);
  }

  if(zone==="vision"){
    x = v.left - c.left + rand(-20,20);
    y = v.top - c.top + rand(-20,20);
  }

  if(zone==="path"){
    x = rand(s.left, v.left) - c.left;
    y = rand(v.top, s.top) - c.top;
  }

  el.style.left = x+"px";
  el.style.top = y+"px";
  canvas.appendChild(el);
}

function render(){
  pEl.textContent = `${step+1} / ${steps.length}`;
  qEl.textContent = steps[step].q;
  oEl.innerHTML = "";

  steps[step].options.forEach(opt=>{
    const b = document.createElement("div");
    b.className = "option";
    b.textContent = opt;
    b.onclick = ()=>{
      place(opt, steps[step].zone);
      step++;
      if(step<steps.length) render();
      else qEl.textContent = "Klar.";
    };
    oEl.appendChild(b);
  });
}

render();
</script>

</body>
</html>
